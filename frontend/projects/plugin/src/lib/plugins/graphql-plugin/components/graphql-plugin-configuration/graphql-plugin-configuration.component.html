<v-form
  (valueChange)="formValueChange($event)"
  *ngIf="{
    disabled: disabled$ | async,
    prefill: prefillConfiguration$ ? (prefillConfiguration$ | async) : null,
    formValue: formValue$ | async
  } as obs"
>
  <v-input
    name="configurationTitle"
    [title]="'configurationTitle' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.configurationTitle"
    [required]="true"
    [widthPx]="350"
    placeholder="GraphQL Plugin"
  >
  </v-input>
  <v-input
    name="graphqlUrl"
    [title]="'graphqlUrl' | pluginTranslate: pluginId | async"
    [margin]="true"
    [disabled]="obs.disabled"
    [defaultValue]="obs.prefill?.graphqlUrl"
    [required]="true"
    [fullWidth]="true"
  >
  </v-input>
  <v-select
    name="authType"
    [title]="'authType' | pluginTranslate: pluginId | async"
    [margin]="true"
    [items]="[
      {id: 'NONE', text: ('authTypeNone' | pluginTranslate: pluginId | async) || 'NONE'},
      {id: 'CLIENT_SECRET', text: ('authTypeClientSecret' | pluginTranslate: pluginId | async) || 'CLIENT_SECRET'},
      {id: 'PRIVATE_KEY_JWT', text: ('authTypePrivateKeyJwt' | pluginTranslate: pluginId | async) || 'PRIVATE_KEY_JWT'}
    ]"
    [defaultSelectionId]="defaultAuthType(obs.prefill)"
    [disabled]="obs.disabled"
    [required]="true"
    [clearable]="false"
    [widthInPx]="350"
  >
  </v-select>
  <ng-container *ngIf="obs.formValue?.authType === 'CLIENT_SECRET'">
    <v-input
      name="tokenUrl"
      [title]="'tokenUrl' | pluginTranslate: pluginId | async"
      [tooltip]="'tokenUrlTooltip' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.tokenUrl"
      [required]="false"
      [widthPx]="350"
    >
    </v-input>
  </ng-container>
  <ng-container
    *ngIf="
      obs.formValue?.authType === 'PRIVATE_KEY_JWT' ||
      (obs.formValue?.authType === 'CLIENT_SECRET' && !obs.formValue?.tokenUrl)
    "
  >
    <v-input
      name="tenantId"
      [title]="'tenantId' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.tenantId"
      [required]="true"
      [widthPx]="350"
    >
    </v-input>
    <ng-container *ngTemplateOutlet="fieldError; context: {field: 'tenantId'}"></ng-container>
    <v-input
      name="resourceUri"
      [title]="'resourceUri' | pluginTranslate: pluginId | async"
      [tooltip]="'resourceUriTooltip' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.resourceUri"
      [required]="true"
      [widthPx]="350"
      placeholder="https://graph.microsoft.com"
    >
    </v-input>
    <ng-container *ngTemplateOutlet="fieldError; context: {field: 'resourceUri'}"></ng-container>
  </ng-container>
  <ng-container *ngIf="obs.formValue?.authType === 'CLIENT_SECRET' || obs.formValue?.authType === 'PRIVATE_KEY_JWT'">
    <v-input
      name="clientId"
      [title]="'clientId' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.clientId"
      [required]="true"
      [widthPx]="350"
    >
    </v-input>
  </ng-container>
  <ng-container *ngIf="obs.formValue?.authType === 'CLIENT_SECRET'">
    <v-input
      name="clientSecret"
      [title]="'clientSecret' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.clientSecret"
      [required]="true"
      [widthPx]="350"
      type="password"
    >
    </v-input>
  </ng-container>
  <ng-container *ngIf="obs.formValue?.authType === 'PRIVATE_KEY_JWT'">
    <v-input
      name="privateKey"
      [title]="'privateKey' | pluginTranslate: pluginId | async"
      [tooltip]="'privateKeyTooltip' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.privateKey"
      [maxLength]="16384"
      [required]="true"
      [widthPx]="350"
      type="password"
    >
    </v-input>
    <ng-container *ngTemplateOutlet="fieldError; context: {field: 'privateKey'}"></ng-container>
    <v-input
      name="certificate"
      [title]="'certificate' | pluginTranslate: pluginId | async"
      [tooltip]="'certificateTooltip' | pluginTranslate: pluginId | async"
      [margin]="true"
      [disabled]="obs.disabled"
      [defaultValue]="obs.prefill?.certificate"
      [maxLength]="16384"
      [required]="true"
      [fullWidth]="true"
      [rows]="8"
      type="textarea"
    >
    </v-input>
    <ng-container *ngTemplateOutlet="fieldError; context: {field: 'certificate'}"></ng-container>
    <p *ngIf="certificateThumbprint$ | async as thumbprint">
      {{ 'certificateThumbprint' | pluginTranslate: pluginId | async }}: <code>{{ thumbprint }}</code>
    </p>
    <p *ngIf="certificateExpiry$ | async as expiry">
      {{ 'certificateExpiry' | pluginTranslate: pluginId | async }}: <code>{{ expiry | date: 'yyyy-MM-dd HH:mm' }}</code>
    </p>
  </ng-container>
</v-form>

<ng-template #fieldError let-field="field">
  <p class="text-danger" *ngIf="(errors$ | async)?.[field] as errorKey">
    {{ errorKey | pluginTranslate: pluginId | async }}
  </p>
</ng-template>
